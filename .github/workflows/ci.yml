name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  testes:
    runs-on: ubuntu-latest
    env:
      AUTH_SECRET: "segredo-de-teste-com-mais-de-24-caracteres"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Testes unitários
        run: npm test
      - name: Build de produção
        run: npm run build
